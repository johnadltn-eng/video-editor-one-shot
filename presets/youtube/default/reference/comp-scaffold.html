<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<title>gN: WHAT IT IS (template · overlay|punch-cut bg-dark|bg-light · zone)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="../hf-anim.js"></script>
<style>
/* gN · timeline START → END (DUR x.xx) · alpha overlay | full-screen bg-dark (STEP_FPS=12 + glow) | bg-light
   THE LOW BAND (anything centred under his face): yTOP → y1030, measured per shoot (chin-line.py).
   Callout L x120 y150 w620 · Callout R x1180 y150 w620 · lower-third x120 y780 w900 h170.
   Copy this file per graphic. Every entrance/exit is a call into hf-anim.js, never retype a helper. */
@font-face{font-family:'SF Pro Display';src:url('../assets/SF-Pro-Display-Black.otf') format('opentype');font-weight:900;}
@font-face{font-family:'SF Pro Display';src:url('../assets/SF-Pro-Display-Bold.otf') format('opentype');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--royal:#1e48ff;--sky:#57c9f0;--txt:#e8f0ff;--muted:#8fa6d4;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'SF Pro Display';}
/* full-screen only: the locked field goes here as #base + #vig (see reference/punch-cut-reference.html); overlays have none */
/* THE FLOAT rides a wrapper that covers the frame; entrance/exit tweens live on the CHILD, never on this */
#float{position:absolute;inset:0;will-change:transform;}
/* every positioned element names its offsets, a position:absolute with none silently lands at 0,0 of its parent */
.card{position:absolute;left:120px;top:150px;width:620px;opacity:0;will-change:transform,opacity;}
</style></head>
<body style="margin:0;background:transparent;">
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="2.0000">
<div id="float">
  <div class="card" id="card">…</div>
</div>
</div>
<script>
// comp starts at START on the timeline. Syncs (word − START − 0.08): word 12.34→0.00 · …
const DUR = 2.0;                                        // == data-duration above, == the placed clip length
const H = HF.init({fps: 24000/1001, dur: DUR /* , stepFps: 12  ← bg-DARK full-screens only */});
const {tl, F, pop, slam, riseIn, exit, float, countUp, reveal} = H;

float('#float', 0, DUR, 'subtle');                      // whole graphic = subtle; ONE hero element = medium
riseIn('#card', 0);                                     // type/cards/panels RISE; objects POP; peers share one entrance
// pop('.chip', 0.42);
// countUp('#num', 0.30, 0.8, 4312, v => '$' + v.toLocaleString('en-US'));
exit('#card');                                          // riseOut two frames before DUR + hard-kill (omit on a full-screen: the cut is the exit)
H.finish();
</script></body></html>
